[package]
name = "shield667"
version = "0.1.0"
edition = "2021"
description = "667 Shield — cross-platform anti-stealer / anti-RAT defensive guard (Chrome cookie/token/password exfiltration protection)"
license = "MIT"

[[bin]]
name = "shield667"
path = "src/main.rs"

[[bin]]
name = "shield667-gui"
path = "src/gui.rs"
required-features = ["gui"]

[lib]
name = "shield667"
path = "src/lib.rs"

[features]
# GUI is opt-in so the default CLI build stays small and low-RAM.
gui = ["dep:eframe", "dep:egui"]

[dependencies]
sha2 = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
walkdir = "2"
sysinfo = "0.33"
arboard = "3"
ureq = { version = "2", features = ["json", "tls"] }
tiny_http = "0.12"
getrandom = "0.2"
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts"] }
egui = { version = "0.29", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
